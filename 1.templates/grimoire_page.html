{% extends "layout.html" %}
{% block content %}

<h1>Chapitre {{ num }}</h1>

<p>{{ page_text }}</p>

<hr>

<h2>Commentaires</h2>

<form action="{{ url_for('comment', num=num) }}" method="POST">
    <textarea name="comment" required></textarea><br>
    <button type="submit">Envoyer</button>
</form>

<ul>
    {% for c in comments %}
        <li>{{ c }}</li>
    {% endfor %}
</ul>

{% endblock %}
