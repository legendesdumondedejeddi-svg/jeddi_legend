services:
  - type: web
    name: legendes-du-monde-de-jeddi
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FLASK_ENV
        value: production
      - key: PAYPAL_BUSINESS
        value: patrick.letoffet@gmail.com
